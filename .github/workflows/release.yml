name: Release

# Three ways in, one release:
#   - push a v* tag by hand (bypasses CI: tags never run ci.yml)
#   - merge a PR labelled release:patch|minor|major; release-on-merge.yml
#     bumps the version, tags it and calls this workflow with the tag
#   - "Run workflow" in the Actions tab, for an existing tag
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_call:
    inputs:
      tag:
        description: The tag to release, e.g. v0.7.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, e.g. v0.7.0
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  # The tag being released: the pushed tag, or the one passed in.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Version check — the tag must match the app version in every manifest.
  # latest.json takes its version from the tag while the app reports the one
  # it was built with, so a mismatch ships an update that offers itself
  # forever (v0.5.0 was built as 0.4.0).
  # ───────────────────────────────────────────────────────────────────────────
  verify-version:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Compare tag with package.json, tauri.conf.json and Cargo.toml
        run: |
          TAG="${RELEASE_TAG#v}"
          PKG=$(jq -r .version package.json)
          CONF=$(jq -r .version src/tauri/tauri.conf.json)
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src/tauri/Cargo.toml | head -1)
          echo "tag=$TAG package.json=$PKG tauri.conf.json=$CONF Cargo.toml=$CARGO"
          if [ "$PKG" != "$TAG" ] || [ "$CONF" != "$TAG" ] || [ "$CARGO" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match the app version. Run node scripts/bump-version.mjs before tagging."
            exit 1
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # Linux build — produces AppImage (Arch-compatible) and .deb
  # Cargo workspace root is the repo root, so artifacts land in ./target/
  # ───────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    needs: verify-version
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: linux-x86_64

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            file \
            squashfs-tools

      - run: npm ci

      # tauri.updater.conf.json turns on signed updater artifacts (.sig files).
      # It's a CI-only overlay so local builds don't need the signing key.
      - name: Build Tauri app (Linux)
        run: npm run tauri:build -- --config tauri.updater.conf.json
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect and rename Linux artifacts
        run: |
          VERSION="$RELEASE_TAG"
          APPIMAGE=$(find target/release/bundle/appimage -name "*.AppImage" | head -1)
          DEB=$(find target/release/bundle/deb -name "*.deb" | head -1)
          cp "$APPIMAGE" "cityofstars_linux_${VERSION}.AppImage"
          cp "$APPIMAGE.sig" "cityofstars_linux_${VERSION}.AppImage.sig"
          cp "$DEB" "cityofstars_linux_${VERSION}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            cityofstars_linux_*.AppImage
            cityofstars_linux_*.AppImage.sig
            cityofstars_linux_*.deb
          if-no-files-found: error
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # Windows build — produces .msi and NSIS .exe installer
  # windows-latest includes VS Build Tools 2022 and WebView2 runtime
  # ───────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: windows-x86_64

      - run: npm ci

      - name: Build Tauri app (Windows)
        run: npm run tauri:build -- --config tauri.updater.conf.json
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect and rename Windows artifacts
        shell: bash
        run: |
          VERSION="$RELEASE_TAG"
          MSI=$(find target/release/bundle/msi -name "*.msi" | head -1)
          EXE=$(find target/release/bundle/nsis -name "*.exe" | head -1)
          cp "$MSI" "cityofstars_windows_${VERSION}_x64.msi"
          cp "$EXE" "cityofstars_windows_${VERSION}_x64-setup.exe"
          cp "$MSI.sig" "cityofstars_windows_${VERSION}_x64.msi.sig"
          cp "$EXE.sig" "cityofstars_windows_${VERSION}_x64-setup.exe.sig"

      - name: Build Tauri app (Windows debug)
        run: npm run tauri:build -- --debug
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Collect and rename Windows debug artifacts
        shell: bash
        run: |
          VERSION="$RELEASE_TAG"
          EXE=$(find target/debug/bundle/nsis -name "*.exe" | head -1)
          cp "$EXE" "cityofstars_windows_${VERSION}_x64-setup-debug.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            cityofstars_windows_*.msi
            cityofstars_windows_*.msi.sig
            cityofstars_windows_*-setup.exe
            cityofstars_windows_*-setup.exe.sig
            cityofstars_windows_*-setup-debug.exe
          if-no-files-found: error
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # Android build — produces signed release APK
  # src/tauri/gen/ is in .gitignore so tauri android init runs every build.
  # Tauri auto-detects the pre-installed NDK; we sign the APK post-build.
  # ───────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build (Android)
    runs-on: ubuntu-22.04
    needs: verify-version
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # v3 downloads the legacy "tools" package, which Google has removed;
      # v4.0.2+ fixed that (v0.3.0's first release run failed here).
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: android

      - name: Install base system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev

      - run: npm ci

      - name: Initialize Android scaffold
        run: npm run tauri:android:init
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build Android APK (release)
        run: npm run tauri:android:build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEY_STORE_BASE64 }}" | base64 --decode \
            > "${{ github.workspace }}/release.keystore"

      - name: Sign APK
        run: |
          VERSION="$RELEASE_TAG"
          UNSIGNED_APK=$(find src/tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks "${{ github.workspace }}/release.keystore" \
            --ks-pass "pass:${{ secrets.ANDROID_KEY_STORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out "cityofstars_${VERSION}_android.apk" \
            "$UNSIGNED_APK"

      - name: Clean up keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: cityofstars_*_android.apk
          if-no-files-found: error
          retention-days: 1

  # ───────────────────────────────────────────────────────────────────────────
  # Create GitHub Release — waits for all three builds to succeed
  # ───────────────────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The manifest the in-app updater reads from releases/latest/download/.
      # A prerelease never becomes "latest", so beta tags don't reach players.
      # The updater tries "{os}-{arch}-{installer}" first, so MSI installs stay
      # on MSI and NSIS installs on NSIS.
      - name: Write updater manifest (latest.json)
        run: |
          TAG="$RELEASE_TAG"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          sig() { cat "$(find artifacts -name "$1" | head -1)"; }
          jq -n \
            --arg version "${TAG#v}" \
            --arg notes "City of Stars ${TAG}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg nsis_url "${BASE}/cityofstars_windows_${TAG}_x64-setup.exe" \
            --arg nsis_sig "$(sig "cityofstars_windows_${TAG}_x64-setup.exe.sig")" \
            --arg msi_url "${BASE}/cityofstars_windows_${TAG}_x64.msi" \
            --arg msi_sig "$(sig "cityofstars_windows_${TAG}_x64.msi.sig")" \
            --arg appimage_url "${BASE}/cityofstars_linux_${TAG}.AppImage" \
            --arg appimage_sig "$(sig "cityofstars_linux_${TAG}.AppImage.sig")" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64":      { url: $nsis_url,     signature: $nsis_sig },
                "windows-x86_64-nsis": { url: $nsis_url,     signature: $nsis_sig },
                "windows-x86_64-msi":  { url: $msi_url,      signature: $msi_sig },
                "linux-x86_64":        { url: $appimage_url, signature: $appimage_sig }
              }
            }' > latest.json
          # Fail the release rather than publish a manifest with an empty signature.
          jq -e '[.platforms[].signature] | all(length > 0)' latest.json
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "City of Stars ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body: |
            ## Downloads

            | Platform | File | Notes |
            |---|---|---|
            | Linux (AppImage) | `cityofstars_linux_${{ env.RELEASE_TAG }}.AppImage` | Works on Arch, Ubuntu, Fedora — no install needed |
            | Linux (.deb) | `cityofstars_linux_${{ env.RELEASE_TAG }}.deb` | Ubuntu/Debian |
            | Windows (.msi) | `cityofstars_windows_${{ env.RELEASE_TAG }}_x64.msi` | MSI installer |
            | Windows (.exe) | `cityofstars_windows_${{ env.RELEASE_TAG }}_x64-setup.exe` | NSIS installer |
            | Windows debug (.exe) | `cityofstars_windows_${{ env.RELEASE_TAG }}_x64-setup-debug.exe` | NSIS installer — console window + DevTools enabled |
            | Android | `cityofstars_${{ env.RELEASE_TAG }}_android.apk` | Sideload APK |

            Windows and Linux AppImage installs from v0.4.0 on update themselves: the app offers the update when one is released. Android and .deb installs get a notice with a download link.

            ### Linux AppImage quick start (Arch and others)
            ```bash
            chmod +x cityofstars_linux_${{ env.RELEASE_TAG }}.AppImage
            ./cityofstars_linux_${{ env.RELEASE_TAG }}.AppImage
            ```
          files: |
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.apk
            artifacts/**/*.sig
            latest.json
          fail_on_unmatched_files: true
