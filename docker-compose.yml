services:

  # ── Development ─────────────────────────────────────────────────────────────
  # Runs the full Tauri app. The native window is forwarded to the host display
  # via the Wayland socket (preferred) or the X11 Unix socket as fallback.
  # GTK auto-selects the backend: Wayland when WAYLAND_DISPLAY is set,
  # X11 otherwise.
  #
  # Usage: make docker-dev   (sets up display env and starts this service)
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - cargo_registry:/usr/local/cargo/registry
      - rust_target_linux:/app/target
      # X11 fallback socket
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      # Wayland socket — host XDG_RUNTIME_DIR mapped to /run/user/host
      - ${XDG_RUNTIME_DIR:-/run/user/1000}:/run/user/host:ro
    # WebKit IPC uses /dev/shm heavily; 64 MB (Docker default) is not enough
    # and causes heap corruption when it fills. 512 MB is a safe ceiling.
    shm_size: 512m
    environment:
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-}
      XDG_RUNTIME_DIR: /run/user/host
      # Required for WebKitGTK to run inside Docker
      WEBKIT_DISABLE_SANDBOX: "1"
      # DMABuf GPU buffer sharing doesn't work in containers — disabling it
      # prevents the heap corruption that causes the white-screen crash.
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      # Disable GPU compositing; fall back to software rendering in Docker.
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      # Limit glibc malloc arenas to reduce fragmentation under WebKit's
      # multi-process workload.
      MALLOC_ARENA_MAX: "2"
    security_opt:
      - seccomp=unconfined
    ports:
      - "1420:1420"
    env_file:
      - path: .env
        required: false
    command: sh -c "npm install && npm run tauri:dev"

  # ── Linux desktop build ──────────────────────────────────────────────────────
  # Produces AppImage / deb / rpm in src/tauri/target/release/bundle/
  #
  # Usage: docker compose --profile build-linux run --rm build-linux
  build-linux:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: build-linux
    volumes:
      - .:/app
      - node_modules_build:/app/node_modules
      - cargo_registry:/usr/local/cargo/registry
      - rust_target_linux:/app/target
    env_file:
      - path: .env
        required: false
    profiles: ["build-linux"]

  # ── Android build ────────────────────────────────────────────────────────────
  # Run `tauri android init` once before the first build (generates src/tauri/gen/).
  # Produces APK/AAB in src/tauri/gen/android/app/build/outputs/
  #
  # Init:  docker compose --profile build-android run --rm build-android sh -c "npm ci && npm run tauri:android:init"
  # Build: docker compose --profile build-android run --rm build-android
  build-android:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: build-android
    volumes:
      - .:/app
      - node_modules_android:/app/node_modules
      - cargo_registry:/usr/local/cargo/registry
      - rust_target_android:/app/target
    env_file:
      - path: .env
        required: false
    profiles: ["build-android"]

volumes:
  node_modules:
  node_modules_build:
  node_modules_android:
  # Shared between dev + build-linux (same host architecture, debug/release are separate subdirs)
  cargo_registry:
  rust_target_linux:
  rust_target_android:
